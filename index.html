<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifragem - Mensagens Secretas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #7c4832, #402115);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }
        h1 {
            font-size: 3rem;
            font-style: italic;
            font-weight: 300;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }
        h1 span {
            font-size: 1rem;
            font-style: normal;
            opacity: 0.8;
        }
        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        input, textarea {
            width: 100%;
            max-width: 450px;
            padding: 14px 18px;
            background-color: rgba(30, 30, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        input::placeholder, textarea::placeholder {
            color: #b0b0b0;
        }
        input:focus, textarea:focus {
            border-color: #ffffff;
            background-color: rgba(30, 30, 30, 0.8);
        }
        textarea {
            border-radius: 15px;
            resize: none;
            height: 90px;
        }
        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
            width: 100%;
        }
        .btn {
            background-color: rgba(40, 40, 40, 0.8);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        .btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: #ffffff;
        }
        .or-text {
            font-weight: bold;
            opacity: 0.8;
        }
        #output-container {
            margin-top: 30px;
            display: none;
            width: 100%;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
            text-align: left;
        }
        #output {
            background: rgba(20, 20, 20, 0.7);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            word-break: break-all;
            font-family: monospace;
            font-size: 1.05rem;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Cifragem<span>.com.br</span></h1>
        <p class="subtitle">Já quis (des)criptografar uma mensagem usando um termo secreto?</p>
        
        <div class="input-group">
            <!-- Campo do Termo Secreto / Senha -->
            <input type="password" id="secretTerm" placeholder="Digite o termo...">
            
            <!-- Campo da Mensagem -->
            <textarea id="messageInput" placeholder="Digite a mensagem..."></textarea>
            
            <!-- Botões de Ação -->
            <div class="buttons-container">
                <button class="btn" onclick="executarCriptografia('cifrar')">CIFRAR</button>
                <span class="or-text">ou</span>
                <button class="btn" onclick="executarCriptografia('decifrar')">DECIFRAR</button>
            </div>
        </div>

        <!-- Área de Saída do Resultado -->
        <div id="output-container">
            <p style="margin: 0 0 5px 5px; font-size: 0.9rem; opacity: 0.9;">Resultado:</p>
            <div id="output"></div>
        </div>
    </div>

    <script>
        function executarCriptografia(acao) {
            const secret = document.getElementById('secretTerm').value;
            const message = document.getElementById('messageInput').value;
            const outputDiv = document.getElementById('output');
            const outputContainer = document.getElementById('output-container');

            if (!secret || !message) {
                alert('Por favor, preencha tanto o termo secreto quanto a mensagem!');
                return;
            }

            outputContainer.style.display = 'block';

            if (acao === 'cifrar') {
                try {
                    let result = '';
                    for (let i = 0; i < message.length; i++) {
                        let charCode = message.charCodeAt(i) ^ secret.charCodeAt(i % secret.length);
                        result += String.fromCharCode(charCode);
                    }
                    outputDiv.innerText = btoa(result); // Codifica em base64 para exibição limpa
                } catch (e) {
                    outputDiv.innerText = 'Erro ao cifrar a mensagem.';
                }
            } else {
                try {
                    let decodedBase64 = atob(message);
                    let result = '';
                    for (let i = 0; i < decodedBase64.length; i++) {
                        let charCode = decodedBase64.charCodeAt(i) ^ secret.charCodeAt(i % secret.length);
                        result += String.fromCharCode(charCode);
                    }
                    outputDiv.innerText = result;
                } catch (e) {
                    outputDiv.innerText = 'Erro: Senha incorreta ou texto cifrado inválido!';
                }
            }
        }
    </script>

</body>
</html>
